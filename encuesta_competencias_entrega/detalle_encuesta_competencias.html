<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de encuesta de competencias</title>
  <link rel="stylesheet" href="encuesta_competencias.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body>
  <div class="page-shell">
    <div class="page-content">
      <section class="card">
        <div class="card-header toolbar-main">
          <div>
            <div class="toolbar-title" id="tituloEncuesta">Detalle de encuesta</div>
            <div class="footer-note" id="subtituloEncuesta"></div>
          </div>

          <div class="toolbar-buttons">
            <a class="btn-action" href="busqueda_encuestas_competencias.html">
              <i class="fa-solid fa-arrow-left"></i> Volver a búsqueda
            </a>

            <a id="btnAyudaDetalle" class="btn-action" href="ayuda_encuestas_competencias.html">
              <i class="fa-solid fa-question-circle"></i> Ayuda
            </a>
          </div>
        </div>

        <div id="detalleContenido"></div>
      </section>
    </div>
  </div>

  <script src="encuestas_competencias_data.js"></script>
  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function pill(text, cls = 'badge-gray') {
      return `<span class="badge ${cls}">${text}</span>`;
    }

    function cardItem(item) {
      return `
        <div class="list-card">
          <strong>${item.tipo}: ${item.codigo || '-'}</strong> · ${item.descripcion || ''}
          <p>${item.justificacion || ''}</p>
        </div>
      `;
    }

    function impactCard(item) {
      return `
        <div class="score-box">
          <h4>${item.area}</h4>
          <div>${pill(item.valoracionTexto || item.valoracion, 'badge-blue')}</div>
          <p>${item.justificacion}</p>
        </div>
      `;
    }

    function ratioPercent(a, b) {
      const total = (a || 0) + (b || 0);
      if (!total) return 0;
      return Math.round(((a || 0) / total) * 100);
    }

    function colorByPercent(value) {
      if (value >= 70) return 'badge-green';
      if (value >= 45) return 'badge-gold';
      return 'badge-red';
    }

    function auditRows(items) {
      return items.map(i => `
        <tr>
          <td>${i.seccion}</td>
          <td>${i.pregunta}</td>
          <td>${i.item}</td>
          <td>${i.tipo}</td>
          <td>${i.codigo || '-'}</td>
          <td>${i.respuesta || '-'}</td>
          <td>${i.valorNumerico ?? '-'}</td>
          <td>${i.coeficiente ?? '-'}</td>
          <td>${i.factorDestino || '-'}</td>
        </tr>
      `).join('');
    }

    const id = getParam('id');
    const encuesta = ENCUESTAS_COMPETENCIAS.find(x => x.idEncuesta === id) || ENCUESTAS_COMPETENCIAS[0];

    function getS41Areas(sourceEncuesta) {
      const areas = Array.isArray(sourceEncuesta?.seccion1?.areasImpacto) ? sourceEncuesta.seccion1.areasImpacto : [];
      const selected = [];

      const pushUnique = area => {
        if (!area) return;
        if (!selected.some(x => (x.area || '').toLowerCase() === (area.area || '').toLowerCase())) {
          selected.push(area);
        }
      };

      pushUnique(areas.find(a => a.area && a.area.toLowerCase().includes('valor')));
      pushUnique(areas.find(a => a.area && (a.area.toLowerCase().includes('analisis') || a.area.toLowerCase().includes('análisis') || a.area.toLowerCase().includes('gestion') || a.area.toLowerCase().includes('gestión'))));
      pushUnique(areas.find(a => a.area && a.area.toLowerCase().includes('tecnic')));
      pushUnique(areas.find(a => a.area && a.area.toLowerCase().includes('liderazgo')));

      areas.forEach(a => {
        if (selected.length < 4) pushUnique(a);
      });

      return selected.slice(0, 4);
    }

    const s41Areas = getS41Areas(encuesta);
    const radarLegendColors = ['#2d6a4f', '#0f766e', '#1d4ed8', '#7c3aed'];

    const S41_STRENGTH_MODEL = [
      {
        area: 'Actuación con valores',
        areaLabel: 'Actuación con valores. Carácter profesional',
        position: 'top',
        strengths: ['Integridad y ejemplaridad', 'Compromiso con la misión']
      },
      {
        area: 'Liderazgo y mando',
        areaLabel: 'Liderazgo y mando',
        position: 'right',
        strengths: ['Liderazgo de equipos', 'Capacidad de decisión', 'Mentoría', 'Humanidad', 'Comunicación']
      },
      {
        area: 'Capacidades de análisis y gestión',
        areaLabel: 'Capacidades de análisis y gestión',
        position: 'bottom',
        strengths: ['Visión estratégica', 'Iniciativa y creatividad', 'Organización y coordinación', 'Planificación de objetivos']
      },
      {
        area: 'Capacidades técnicas',
        areaLabel: 'Capacidades técnicas',
        position: 'left',
        strengths: ['Conocimiento experto', 'Rigor en la ejecución']
      }
    ];

    function getAreaBaseValues(sourceEncuesta) {
      const result = {
        'Actuación con valores': 1.0,
        'Capacidades de análisis y gestión': 1.0,
        'Liderazgo y mando': 1.0,
        'Capacidades técnicas': 1.0
      };

      const areas = Array.isArray(sourceEncuesta?.seccion1?.areasImpacto) ? sourceEncuesta.seccion1.areasImpacto : [];
      areas.forEach(item => {
        const name = (item.area || '').toLowerCase();
        const val = item.valorNumerico || 1.0;
        if (name.includes('valor')) result['Actuación con valores'] = val;
        if (name.includes('analisis') || name.includes('análisis') || name.includes('gestion') || name.includes('gestión')) result['Capacidades de análisis y gestión'] = val;
        if (name.includes('liderazgo')) result['Liderazgo y mando'] = val;
        if (name.includes('tecnic')) result['Capacidades técnicas'] = val;
      });

      return result;
    }

    function s41StrengthTag(strength, enc) {
      const fortalezas = Array.isArray(enc && enc.seccion1 && enc.seccion1.fortalezas ? enc.seccion1.fortalezas : []) ? (enc.seccion1.fortalezas || []) : [];
      const words = (strength || '').toLowerCase().split(/\s+/).filter(w => w.length > 4);
      const isFortaleza = words.length > 0 && fortalezas.some(f =>
        words.some(w => (f.descripcion || '').toLowerCase().includes(w))
      );
      const base = 'padding:5px 10px;border-radius:5px;font-size:12px;display:inline-block;line-height:1.5;';
      return '<span style="' + base + (isFortaleza
        ? 'background:#1d4ed8;color:#fff;font-weight:600;'
        : 'background:#f1f5f9;border:1px solid #c7d3e0;color:#334155;') + '">' + strength + '</span>';
    }

    document.getElementById('tituloEncuesta').textContent = `Encuesta ${encuesta.idEncuesta}`;
    document.getElementById('subtituloEncuesta').innerHTML =
      `${pill(encuesta.estadoEncuesta, encuesta.estadoEncuesta === 'VALIDADA' ? 'badge-green' : encuesta.estadoEncuesta === 'EN_CURSO' ? 'badge-gold' : 'badge-blue')}
       ${pill(encuesta.rolEvaluador)}
       <span style="margin-left:8px;">${encuesta.resumenPerfil || ''}</span>`;

    document.getElementById('btnAyudaDetalle').href =
      `ayuda_encuestas_competencias.html?page=detalle&id=${encodeURIComponent(encuesta.idEncuesta)}`;

    document.getElementById('detalleContenido').innerHTML = `
      <div class="tabs">
        <button class="tab active" data-tab="tabResumen">Resumen</button>
        <button class="tab" data-tab="tabS1">Sección 1</button>
        <button class="tab" data-tab="tabS2">Sección 2</button>
        <button class="tab" data-tab="tabS3">Sección 3</button>
        <button class="tab" data-tab="tabS4">Sección 4</button>
        <button class="tab" data-tab="tabAudit">Auditoría</button>
      </div>

      <div id="tabResumen" class="tab-panel active">
        <div class="grid-2">
          <div class="subcard">
            <h3 class="section-title">Metadatos de encuesta</h3>
            <div class="definition-list">
              <div class="term">Id encuesta</div><div class="value">${encuesta.idEncuesta}</div>
              <div class="term">Año</div><div class="value">${encuesta.anioEncuesta}</div>
              <div class="term">Tipo</div><div class="value">${encuesta.tipoEncuesta}</div>
              <div class="term">Estado</div><div class="value">${encuesta.estadoEncuesta}</div>
              <div class="term">Fecha creación</div><div class="value">${encuesta.fechaCreacion}</div>
              <div class="term">Fecha cierre</div><div class="value">${encuesta.fechaCierre || '-'}</div>
              <div class="term">Puesto</div><div class="value">${encuesta.codigoPuesto}</div>
              <div class="term">Origen</div><div class="value">${encuesta.origenSistema}</div>
            </div>
          </div>

          <div class="subcard">
            <h3 class="section-title">Posicionamiento rápido</h3>
            <div class="kpi-row" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:0;">
              <div class="kpi-card">
                <div class="kpi-label">Fortalezas S1</div>
                <div class="kpi-value">${encuesta.seccion1.fortalezas.length}</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Debilidades S1</div>
                <div class="kpi-value">${encuesta.seccion1.debilidades.length}</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Fortalezas S3</div>
                <div class="kpi-value">${encuesta.seccion3.fortalezas.length}</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Mejoras S3</div>
                <div class="kpi-value">${encuesta.seccion3.mejoras.length}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="grid-2" style="margin-top:18px;">
          <div class="subcard">
            <h3 class="section-title">Datos del evaluado</h3>
            <div class="definition-list">
              <div class="term">Nombre</div><div class="value">${encuesta.evaluado.nombreCompleto}</div>
              <div class="term">DNI</div><div class="value">${encuesta.evaluado.dni}</div>
              <div class="term">Empleo</div><div class="value">${encuesta.evaluado.empleo}</div>
              <div class="term">Escala / cuerpo</div><div class="value">${encuesta.evaluado.escala} / ${encuesta.evaluado.cuerpo}</div>
              <div class="term">Cargo</div><div class="value">${encuesta.evaluado.cargo}</div>
              <div class="term">Destino</div><div class="value">${encuesta.evaluado.destino}</div>
              <div class="term">Código unidad</div><div class="value">${encuesta.evaluado.codigoUnidad}</div>
              <div class="term">Código puesto</div><div class="value">${encuesta.evaluado.codigoPuesto}</div>
            </div>
          </div>

          <div class="subcard">
            <h3 class="section-title">Datos del evaluador</h3>
            <div class="definition-list">
              <div class="term">Nombre</div><div class="value">${encuesta.evaluador.nombreCompleto}</div>
              <div class="term">DNI</div><div class="value">${encuesta.evaluador.dni}</div>
              <div class="term">Empleo</div><div class="value">${encuesta.evaluador.empleo}</div>
              <div class="term">Escala / cuerpo</div><div class="value">${encuesta.evaluador.escala} / ${encuesta.evaluador.cuerpo}</div>
              <div class="term">Cargo</div><div class="value">${encuesta.evaluador.cargo}</div>
              <div class="term">Destino</div><div class="value">${encuesta.evaluador.destino}</div>
              <div class="term">Código unidad</div><div class="value">${encuesta.evaluador.codigoUnidad}</div>
              <div class="term">Rol</div><div class="value">${encuesta.rolEvaluador}</div>
            </div>
          </div>
        </div>
      </div>

      <div id="tabS1" class="tab-panel">
        <div class="subcard">
          <h3 class="section-title">Áreas de impacto</h3>
          <div class="score-grid">${encuesta.seccion1.areasImpacto.map(impactCard).join('')}</div>
        </div>

        <div class="grid-2" style="margin-top:18px;">
          <div class="subcard">
            <h3 class="section-title">Fortalezas del evaluador</h3>
            ${encuesta.seccion1.fortalezas.map(cardItem).join('')}
          </div>

          <div class="subcard">
            <h3 class="section-title">Debilidades / áreas de desarrollo</h3>
            ${encuesta.seccion1.debilidades.map(cardItem).join('')}
          </div>
        </div>
      </div>

      <div id="tabS2" class="tab-panel">
        <div class="grid-2">
          <div class="subcard">
            <h3 class="section-title">2.1 Deseo de contar con el individuo</h3>
            <p>${pill(encuesta.seccion2.p21.respuestaTexto || encuesta.seccion2.p21.respuesta, 'badge-blue')}</p>
            <p>${encuesta.seccion2.p21.justificacion}</p>
          </div>

          <div class="subcard">
            <h3 class="section-title">2.2 Potencial para el siguiente empleo</h3>
            <p>${pill(encuesta.seccion2.p22.respuestaTexto || encuesta.seccion2.p22.respuesta, 'badge-blue')}</p>
            <p>${encuesta.seccion2.p22.justificacion}</p>
          </div>

          <div class="subcard">
            <h3 class="section-title">2.3 Potencial para especial responsabilidad</h3>
            <p>${pill(encuesta.seccion2.p23.respuestaTexto || encuesta.seccion2.p23.respuesta, 'badge-blue')}</p>
            <p>${encuesta.seccion2.p23.justificacion}</p>
          </div>

          <div class="subcard">
            <h3 class="section-title">2.4 Motivación para progresar</h3>
            <p>${pill(encuesta.seccion2.p24.respuestaTexto || encuesta.seccion2.p24.respuesta, 'badge-blue')}</p>
            <p>${encuesta.seccion2.p24.justificacion}</p>
          </div>
        </div>

        <div class="subcard" style="margin-top:18px;">
          <h3 class="section-title">2.5 Recomendación de carrera</h3>
          <p><strong>${encuesta.seccion2.p25.respuesta}</strong></p>
          <p>${encuesta.seccion2.p25.justificacion}</p>
        </div>
      </div>

      <div id="tabS3" class="tab-panel">
        <div class="subcard">
          <h3 class="section-title">3.1 Expectativas de futuro</h3>
          <p>${encuesta.seccion3.expectativas.map(x => pill(x, 'badge-gold')).join(' ')}</p>
          <p>${encuesta.seccion3.justificacionExpectativas}</p>
        </div>

        <div class="subcard" style="margin-top:18px;">
          <h3 class="section-title">3.2 Autopercepción profesional</h3>
          <p>${pill(encuesta.seccion3.p32.respuestaTexto || encuesta.seccion3.p32.respuesta, 'badge-blue')}</p>
          <p>${encuesta.seccion3.p32.justificacion || 'Sin justificación adicional.'}</p>
        </div>

        <div class="grid-2" style="margin-top:18px;">
          <div class="subcard">
            <h3 class="section-title">3.3 Fortalezas del evaluado</h3>
            ${encuesta.seccion3.fortalezas.map(cardItem).join('')}
          </div>

          <div class="subcard">
            <h3 class="section-title">3.4 Competencias / áreas a mejorar</h3>
            ${encuesta.seccion3.mejoras.map(cardItem).join('')}
          </div>
        </div>

        <div class="subcard" style="margin-top:18px;">
          <h3 class="section-title">3.5 Observaciones adicionales</h3>
          <p>${encuesta.seccion3.observacionesAdicionales || 'Sin observaciones.'}</p>
        </div>
      </div>

      <div id="tabS4" class="tab-panel">
        <div class="subtabs">
          <button class="subtab active" data-subtab="tabS4Parte1">Primera parte</button>
          <button class="subtab" data-subtab="tabS4Parte2">Segunda parte</button>
        </div>

        <div id="tabS4Parte1" class="subtab-panel active">
          <div class="subcard">
            <h3 class="section-title">Primera parte - Analisis estadistico del talento</h3>
            <p style="font-size:14px;color:#64748b;margin-bottom:20px;">Esta parte es generada de forma automática por la aplicación informática en base a los datos del individuo registrados en la misma. A lo largo del informe se incluyen espacios para anotaciones y aclaraciones voluntarias del personal de la Sección de Análisis del Talento.</p>

            <div class="accordion-group">
              <!-- Sección 4.1 -->
              <div class="accordion-item open">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                  <span><strong>Sección 1</strong> – Resumen estadístico de fortalezas y debilidades competenciales</span>
                  <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="accordion-body">
                  <div class="accordion-content">
                    <p style="font-size:14px;color:#64748b;margin-bottom:20px;">En esta sección se identifican de forma estadística (en base a resultados de los Informes de Competencias) las fortalezas y áreas de desarrollo competenciales del individuo.</p>
                    
                    <!-- Gráfico Radar de Competencias -->
                    <div style="background:#f4f7fb;border:1px solid #dde5ee;border-radius:8px;padding:20px 16px;margin-bottom:24px;">
                      <!-- Leyenda -->
                      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;">
                        <span style="font-size:12px;color:#64748b;">Menor fortaleza</span>
                        <div style="height:3px;width:72px;background:linear-gradient(to right,#cbd5e1,#1d4ed8);border-radius:2px;"></div>
                        <span style="font-size:12px;font-weight:700;color:#1d4ed8;">+ Mayor fortaleza</span>
                      </div>
                      <!-- Grid 3×3 -->
                      <div style="display:grid;grid-template-columns:180px minmax(0,1fr) 180px;grid-template-rows:auto auto auto;align-items:center;gap:10px 6px;">
                        <div></div>
                        <div style="text-align:center;">
                          <div style="font-weight:700;font-size:13px;color:#0f172a;margin-bottom:8px;">Actuación con valores. Carácter profesional</div>
                          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                            ${(S41_STRENGTH_MODEL.find(g => g.position === 'top') || {strengths:[]}).strengths.map(s => s41StrengthTag(s, encuesta)).join('')}
                          </div>
                        </div>
                        <div></div>
                        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
                          <div style="font-weight:700;font-size:13px;color:#0f172a;text-align:right;margin-bottom:2px;">Capacidades técnicas</div>
                          ${(S41_STRENGTH_MODEL.find(g => g.position === 'left') || {strengths:[]}).strengths.map(s => '<div>' + s41StrengthTag(s, encuesta) + '</div>').join('')}
                        </div>
                        <div style="position:relative;height:280px;">
                          <canvas id="radarS41Chart"></canvas>
                        </div>
                        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;">
                          <div style="font-weight:700;font-size:13px;color:#0f172a;margin-bottom:2px;">Liderazgo y mando</div>
                          ${(S41_STRENGTH_MODEL.find(g => g.position === 'right') || {strengths:[]}).strengths.map(s => '<div>' + s41StrengthTag(s, encuesta) + '</div>').join('')}
                        </div>
                        <div></div>
                        <div style="text-align:center;">
                          <div style="font-weight:700;font-size:13px;color:#0f172a;margin-bottom:8px;">Capacidades de análisis y gestión</div>
                          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:320px;margin:0 auto;">
                            ${(S41_STRENGTH_MODEL.find(g => g.position === 'bottom') || {strengths:[]}).strengths.map(s => s41StrengthTag(s, encuesta)).join('')}
                          </div>
                        </div>
                        <div></div>
                      </div>
                    </div>

                    <!-- Espacio de anotaciones para el analista -->
                    <div style="border:2px solid #f08c00;border-radius:8px;padding:16px;background:#fff9f0;margin-top:24px;">
                      <p style="font-size:12px;color:#6d4d00;margin:0 0 12px 0;font-weight:bold;">Espacio para anotaciones del personal de la Sección de Análisis del Talento</p>
                      <textarea id="anotacionesS41" style="width:100%;height:100px;padding:8px;border:1px solid #f08c00;border-radius:4px;font-size:13px;font-family:inherit;resize:vertical;" placeholder="Recomendaciones, análisis adicional o observaciones sobre las fortalezas y áreas de desarrollo identificadas..."></textarea>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Sección 4.2 -->
              <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                  <span><strong>Sección 2</strong> – Estadísticas sobre el potencial del individuo</span>
                  <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="accordion-body">
                  <div class="accordion-content">
                    <p style="color:#94a3b8;font-size:13px;font-style:italic;">Pendiente de desarrollo. Contenido a definir con el cliente.</p>
                  </div>
                </div>
              </div>

              <!-- Sección 4.3 -->
              <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                  <span><strong>Sección 3</strong> – Estadísticas clave de la Encuesta de Colaboradores</span>
                  <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="accordion-body">
                  <div class="accordion-content">
                    <p style="color:#94a3b8;font-size:13px;font-style:italic;">Pendiente de desarrollo. Contenido a definir con el cliente.</p>
                  </div>
                </div>
              </div>

              <!-- Sección 4.4 – Resumen de conocimientos y experiencia -->
              <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                  <span><strong>Sección 4</strong> – Resumen de conocimientos y experiencia</span>
                  <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="accordion-body">
                  <div class="accordion-content">
                    <p style="font-size:14px;color:#64748b;margin-bottom:16px;">En esta sección se exponen la experiencia y los conocimientos del candidato.</p>

                    <!-- Banner demo -->
                    <div style="background:#c0392b;color:#fff;border-radius:6px;padding:12px 16px;text-align:center;font-size:13px;font-weight:600;margin-bottom:24px;line-height:1.5;">
                      Esta sección se generará automáticamente de forma digital.<br>La información que aparece en esta versión es un ejemplo.
                    </div>

                    <!-- Experiencia -->
                    <div style="margin-bottom:28px;">
                      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--azul-apoyo);">

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    document.querySelectorAll('.subtab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.subtab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.subtab-panel').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.subtab).classList.add('active');
        // Reiniciar gráficos cuando se cambia de subtab
        setTimeout(renderRadarS41, 100);
      });
    });

    // Accordion toggle handler
    function toggleAccordion(headerElement) {
      const item = headerElement.parentElement;
      item.classList.toggle('open');
      // Si se abre la sección 4.1, renderizar el gráfico
      if (item.classList.contains('open')) {
        setTimeout(renderRadarS41, 100);
      }
    }

    function getDefaultS4Parte2State() {
      const p21 = String(encuesta.seccion2.p21.respuesta || '').toLowerCase();
      const p25 = String(encuesta.seccion2.p25.respuesta || '').toLowerCase();
      let q12 = 'apto';
      if (p25.includes('no apto')) q12 = 'no_apto';
      else if (p25.includes('no recomendado')) q12 = 'no_recomendado';
      else if (p25.includes('prioritario')) q12 = 'prioritario';
      else if (p25.includes('recomendado')) q12 = 'recomendado';
      else if (p25.includes('apto')) q12 = 'apto';
      return {
        q11: p21.includes('si') ? 'cumple' : 'no_cumple',
        q11Just: p21.includes('si') ? '' : (encuesta.seccion2.p21.justificacion || ''),
        q12,
        q12Just: encuesta.seccion2.p25.justificacion || ''
      };
    }

    function getS4Parte2SessionKey() {
      return 's4parte2:' + (encuesta.idEncuesta || 'default');
    }

    function loadS4Parte2State() {
      const fallback = getDefaultS4Parte2State();
      try {
        const raw = sessionStorage.getItem(getS4Parte2SessionKey());
        if (!raw) return fallback;
        return { ...fallback, ...JSON.parse(raw) };
      } catch {
        return fallback;
      }
    }

    function saveS4Parte2State(state) {
      try {
        sessionStorage.setItem(getS4Parte2SessionKey(), JSON.stringify(state));
      } catch {
        // noop
      }
    }

    function paintChoiceButtons(group, selectedValue) {
      const isNegative = selectedValue === 'no_cumple' || selectedValue === 'no_apto' || selectedValue === 'no_recomendado';
      document.querySelectorAll('[data-choice-group="' + group + '"]').forEach(btn => {
        const active = btn.dataset.choiceValue === selectedValue;
        btn.style.borderColor = active ? (isNegative ? '#dc2626' : '#2563eb') : '#94a3b8';
        btn.style.background = active ? (isNegative ? '#fee2e2' : '#dbeafe') : '#f8fafc';
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function initS4Parte2Interactive() {
      const q11Just = document.getElementById('s4p2-q11-just');
      const q12Just = document.getElementById('s4p2-q12-just');
      if (!q11Just || !q12Just) return;

      let state = loadS4Parte2State();

      q11Just.value = state.q11Just || '';
      q12Just.value = state.q12Just || '';
      paintChoiceButtons('q11', state.q11);
      paintChoiceButtons('q12', state.q12);

      document.querySelectorAll('[data-choice-group="q11"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state = { ...state, q11: btn.dataset.choiceValue };
          paintChoiceButtons('q11', state.q11);
          saveS4Parte2State(state);
        });
      });

      document.querySelectorAll('[data-choice-group="q12"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state = { ...state, q12: btn.dataset.choiceValue };
          paintChoiceButtons('q12', state.q12);
          saveS4Parte2State(state);
        });
      });

      q11Just.addEventListener('input', () => {
        state = { ...state, q11Just: q11Just.value };
        saveS4Parte2State(state);
      });

      q12Just.addEventListener('input', () => {
        state = { ...state, q12Just: q12Just.value };
        saveS4Parte2State(state);
      });
    }

    // Renderiza radar de 4 ejes — uno por área de impacto (top/right/bottom/left)
    function renderRadarS41() {
      const canvas = document.getElementById('radarS41Chart');
      if (!canvas) return;

      const areaValues = getAreaBaseValues(encuesta);
      // Orden horario desde 12h: top → right → bottom → left
      const radarOrder = [
        'Actuación con valores',
        'Liderazgo y mando',
        'Capacidades de análisis y gestión',
        'Capacidades técnicas'
      ];

      // Etiquetas vacías — los labels están en el HTML del grid
      const labels = radarOrder.map(() => '');
      const valores = radarOrder.map(k => areaValues[k] || 1.0);

      if (window.radarS41Instance) {
        window.radarS41Instance.destroy();
      }

      const ctx = canvas.getContext('2d');
      window.radarS41Instance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Perfil competencial',
            data: valores,
            fill: true,
            backgroundColor: 'rgba(29, 78, 216, 0.12)',
            borderColor: '#1d4ed8',
            pointBackgroundColor: '#1d4ed8',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            pointRadius: 5,
            borderWidth: 2.5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          scales: {
            r: {
              beginAtZero: false,
              min: 0.9,
              max: 1.25,
              ticks: { display: false },
              pointLabels: { display: false },
              grid: { color: '#dde5ee' },
              angleLines: { color: '#c7d3e0' }
            }
          }
        }
      });
    }

    // Renderizar el gráfico después de un pequeño delay para asegurar que el canvas esté listo
    setTimeout(renderRadarS41, 200);
    initS4Parte2Interactive();

    function showFeedback(containerId, isError, msg) {
      const el = document.getElementById(containerId);
      if (!el) return;
      el.innerHTML = '<div style="display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:7px;font-size:13px;font-weight:600;'
        + (isError
            ? 'background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;'
            : 'background:#dcfce7;border:1px solid #86efac;color:#166534;')
        + '"><i class="fa-solid ' + (isError ? 'fa-circle-exclamation' : 'fa-circle-check') + '"></i>' + msg + '</div>';
      setTimeout(() => { el.innerHTML = ''; }, 4000);
    }

    function guardarParte1() {
      const textarea = document.getElementById('anotacionesS41');
      const texto = textarea ? textarea.value.trim() : '';
      const key = 's4parte1:' + (encuesta.idEncuesta || 'default');
      try {
        sessionStorage.setItem(key, JSON.stringify({ anotaciones: texto, savedAt: new Date().toISOString() }));
        showFeedback('feedbackParte1', false, 'Primera parte guardada correctamente.');
      } catch {
        showFeedback('feedbackParte1', true, 'Error al guardar. Inténtalo de nuevo.');
      }
    }

    (function loadParte1() {
      const key = 's4parte1:' + (encuesta.idEncuesta || 'default');
      try {
        const raw = sessionStorage.getItem(key);
        if (!raw) return;
        const data = JSON.parse(raw);
        const textarea = document.getElementById('anotacionesS41');
        if (textarea && data.anotaciones != null) textarea.value = data.anotaciones;
      } catch { /* noop */ }
    })();

    function guardarParte2() {
      const state = loadS4Parte2State();
      const errors = [];

      if (!state.q11) {
        errors.push('Debes seleccionar una opción en la pregunta 1.1 (Cumple / No cumple).');
      } else if (state.q11 === 'no_cumple' && !state.q11Just.trim()) {
        errors.push('Al marcar "No cumple" en 1.1 es obligatorio incluir una justificación.');
        const ta = document.getElementById('s4p2-q11-just');
        if (ta) { ta.style.borderColor = '#dc2626'; ta.focus(); }
      } else {
        const ta11 = document.getElementById('s4p2-q11-just');
        if (ta11) ta11.style.borderColor = '#cbd5e1';
      }

      if (!state.q12) {
        errors.push('Debes seleccionar una opción en la pregunta 1.2.');
      }

      if ((state.q12 === 'no_apto' || state.q12 === 'no_recomendado') && !state.q12Just.trim()) {
        errors.push('Las opciones "No apto" y "No recomendado" requieren justificación obligatoria.');
        const ta = document.getElementById('s4p2-q12-just');
        if (ta) { ta.style.borderColor = '#dc2626'; ta.focus(); }
      } else {
        const ta12 = document.getElementById('s4p2-q12-just');
        if (ta12) ta12.style.borderColor = '#cbd5e1';
      }

      if (errors.length > 0) {
        showFeedback('feedbackParte2', true, errors[0]);
        return;
      }

      saveS4Parte2State(state);
      showFeedback('feedbackParte2', false, 'Segunda parte guardada correctamente.');
    }
  </script>
